name: Cloud Grindset Unified Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true 
          tags: cloudgrindset-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save cloudgrindset-app:latest > cloudgrindset-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: cloudgrindset-app.tar

      - name: Run Pylint
        run: docker run --rm cloudgrindset-app:latest pylint iac/*.py

  security:
    name: Security Scan 
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load Docker image
        run: docker load < cloudgrindset-app.tar

      - name: Run Checkov (Terraform)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  deployment:
    name: Deployment
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Start LocalStack
        run: |
          docker compose up -d localstack
          until curl -s http://localhost:4566/_localstack/health | grep -q '"cloudformation": "available"'; do
            echo "Waiting for LocalStack..."
            sleep 5
          done

      - name: Terraform Init & Validate
        working-directory: ./terraform
        run: |
          terraform init
          terraform validate

      - name: Terraform (Networking & IAM)
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform apply -auto-approve -target=aws_vpc.main -target=aws_subnet.public -target=aws_iam_instance_profile.web_server_profile
          echo "Network layer deployed. Sleeping..."
          sleep 15

      - name: Terraform Full Apply & Self-Healing
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform apply -auto-approve || {
            echo "DETECTED RACE CONDITION: Cleaning up state and retrying..."
            
            # 1. Remove the broken instance from the local state file
            terraform state rm aws_instance.web_server || true
            
            # 2. Refresh state against LocalStack
            terraform refresh
            
            # 3. Final attempt
            sleep 5
            terraform apply -auto-approve
          }

      - name: Deploy and Test
        env:
          AWS_ENDPOINT_URL: http://localstack:4566
          STACK_NAME: iam
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          until curl -s http://localhost:4566/_localstack/health | grep -q '"ec2": "running"'; do sleep 2; done
          
          docker load < cloudgrindset-app.tar
          docker compose run --name cloudgrindset_app app bash -c "bash ./lab_scripts/deploy_all.sh && python -m pytest tests/test_infra.py -v"