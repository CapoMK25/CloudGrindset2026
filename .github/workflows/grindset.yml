name: Cloud Grindset Unified Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true 
          tags: cloudgrindset-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save cloudgrindset-app:latest > cloudgrindset-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: cloudgrindset-app.tar

      - name: Run Pylint
        run: docker run --rm cloudgrindset-app:latest pylint iac/*.py

  security:
    name: Security Scan 
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load Docker image
        run: docker load < cloudgrindset-app.tar

      - name: Run Checkov (Terraform)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  deployment:
    name: Deployment
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Start LocalStack
        run: |
          docker compose up -d localstack
          echo "Waiting for LocalStack services..."
          until curl -s http://localhost:4566/_localstack/health | grep -q '"ec2": "available"'; do sleep 5; done

      - name: Terraform Init & Clean
        working-directory: ./terraform
        run: |
          rm -rf .terraform .terraform.lock.hcl
          terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          echo "Files in current directory"
          ls -F
          echo "Running Validation"
          terraform validate

      - name: Terraform Plan and Apply
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          for i in {1..3}; do
            echo "Apply attempt $i..."
            # Capture stdout and stderr
            if terraform apply -auto-approve main.tfplan > output.log 2>&1; then
              echo "Apply successful!"
              break
            else
              echo "Apply failed on attempt $i. Capturing logs..."
              docker logs cloudgrindset2026 > localstack_failure_$i.log 2>&1
              cat output.log
              
              if [ $i -eq 3 ]; then
                echo "Final attempt failed."
                exit 1
              fi
              echo "Sleeping for 15s..."
              sleep 15
            fi
          done

      - name: Upload Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localstack-debug-logs
          path: terraform/localstack_failure_*.log

      - name: Deploy and Test
        env:
          AWS_ENDPOINT_URL: http://localstack:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          docker load < cloudgrindset-app.tar
          docker compose run --name cloudgrindset_app app bash -c "bash ./lab_scripts/deploy_all.sh && python -m pytest tests/test_infra.py -v"