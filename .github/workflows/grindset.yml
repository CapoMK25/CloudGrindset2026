name: Cloud Grindset Unified Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # PHASE 1: The Gatekeeper
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true 
          tags: cloudgrindset-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save cloudgrindset-app:latest > cloudgrindset-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: cloudgrindset-app.tar

      - name: Run Pylint
        run: docker run --rm cloudgrindset-app:latest pylint iac/*.py

      - name: Generate Diagram
        run: |
          mkdir -p assets
          docker run --rm -v ${{ github.workspace }}/assets:/app/assets cloudgrindset-app:latest python iac/docs.py

      - name: Commit and Push Diagram
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions@github.com"
          git add assets/*.png || true
          if ! git diff --cached --exit-code; then
            git commit -m "docs: auto-update architecture diagram"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

  # PHASE 2: The Security Guard
  security:
    name: Security Scan 
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load Docker image
        run: docker load < cloudgrindset-app.tar

      - name: Generate YAML Templates
        run: |
          mkdir -p yaml
          docker run --rm -v ${{ github.workspace }}/yaml:/app/yaml cloudgrindset-app:latest /bin/bash -c "for f in iac/*.py; do python \$f > yaml/\$(basename \$f .py).yaml; done"
          sudo chown -R $USER:$USER yaml/
          
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: yaml/
          framework: cloudformation
          soft_fail: false

  # PHASE 3: The Deployer
  deployment:
    name: Deployment
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Checkout Website
        uses: actions/checkout@v4
        with:
          repository: CapoMK25/regional-map-2024
          path: regional-map-2024

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load Docker image
        run: docker load < cloudgrindset-app.tar

      - name: Start LocalStack
        run: |
          docker compose up -d localstack
          until curl -s http://localhost:4566/_localstack/health | grep -q '"cloudformation": "available"'; do
            sleep 5
          done

      - name: Deploy Infrastructure
        env:
          AWS_ENDPOINT_URL: http://localstack:4566
        run: |
          docker compose up localstack -d
          until curl -s http://localhost:4566/_localstack/health | grep -q '"cloudformation": "available"'; do
            sleep 5
          done
          docker compose run --name cloudgrindset_app app

      - name: Run Integration Tests
        run: |
          docker exec \
            -e AWS_ENDPOINT_URL=http://localstack:4566 \
            -e STACK_NAME=iam \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            cloudgrindset_app python -m pytest tests/test_infra.py -v -s -ra