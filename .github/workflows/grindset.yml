name: Cloud Grindset Unified Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # PHASE 1: The Gatekeeper
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true 
          tags: cloudgrindset-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save cloudgrindset-app:latest > cloudgrindset-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: cloudgrindset-app.tar

      - name: Run Pylint
        run: docker run --rm cloudgrindset-app:latest pylint iac/*.py docs/*.py

      - name: Generate Diagram
        run: |
          mkdir -p assets
          docker run --rm -v ${{ github.workspace }}/assets:/app/assets cloudgrindset-app:latest python docs/docs.py

      - name: Commit and Push Diagram
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions@github.com"
          git add assets/*.png || true
          if ! git diff --cached --exit-code; then
            git commit -m "docs: auto-update architecture diagram"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

  # PHASE 2: The Security Section
  security:
    name: Security Scan 
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load Docker image
        run: docker load < cloudgrindset-app.tar

      - name: Generate YAML Templates
        run: |
          mkdir -p yaml
          docker run --rm -v ${{ github.workspace }}/yaml:/app/yaml cloudgrindset-app:latest /bin/bash -c "for f in iac/*.py; do python \$f > yaml/\$(basename \$f .py).yaml; done"
          sudo chown -R $USER:$USER yaml/
          
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: yaml/
          framework: cloudformation
          soft_fail: false

  # PHASE 3: The Deployment Section
  deployment:
    name: Deployment
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC
        uses: actions/checkout@v4

      - name: Checkout Website
        uses: actions/checkout@v4
        with:
          repository: CapoMK25/regional-map-2024
          path: regional-map-2024

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Load Docker image
        run: docker load < cloudgrindset-app.tar

      - name: Deploy and Test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          WEBSITE_CONTENT_DIR: ${{ github.workspace }}/regional-map-2024
        run: |
          # 1. Start LocalStack once
          docker compose up -d localstack

          # 2. Wait for the port to be ready
          echo "Waiting for LocalStack port 4566..."
          until nc -z localhost 4566; do
            echo "LocalStack not ready yet... sleeping"
            sleep 5
          done
          
          # 3. Deployment and tests
          docker compose run --rm app bash -c "bash ./lab_scripts/deploy_all.sh && pytest tests/test_infra.py -v"