name: CI/CD for Troposphere

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.3

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint troposphere localstack-client

      # Step 4: Lint Python code
      - name: Run Pylint
        run: |
          pylint iac/*.py

      # Step 5: Start LocalStack (optional)
      - name: Start LocalStack
        run: docker run -d -p 4566:4566 -p 4571:4571 --name localstack localstack/localstack

      # Step 6: Wait for LocalStack to be ready
      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack to be ready..."
          until curl -s http://localhost:4566/_localstack/health | grep '"services":'; do
            sleep 10
          done

      # Step 7: Deploy stacks to LocalStack
      - name: Deploy to LocalStack
        env:
            AWS_ACCESS_KEY_ID: test
            AWS_SECRET_ACCESS_KEY: test
            AWS_DEFAULT_REGION: us-east-1
        run: bash ./lab_scripts/deploy.sh
