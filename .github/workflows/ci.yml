env:
  DEPLOY_LOCALSTACK: 'false'

name: CI for linting at the start

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.3

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint troposphere

      # Step 4: Lint Python
      - name: Run Pylint
        run: |
          pylint iac/*.py

        # Step 5: Deploy to LocalStack (optional)
      - name: Deploy to LocalStack
        if: env.DEPLOY_LOCALSTACK == 'true'
        run: |
          pip install localstack-client
          docker run -d --name localstack -p 4566:4566 -p 4571:4571 localstack/localstack
            echo "Waiting for LocalStack to start..."
            sleep 20  # wait 15 seconds
          ./lab_scripts/deploy.sh
