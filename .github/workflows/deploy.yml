name: CD LocalStack Deployment

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed

concurrency:
  group: localstack-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install localstack-client

      - name: Start LocalStack
        run: docker run -d -p 4566:4566 -p 4571:4571 localstack/localstack

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack..."
          until curl -s http://localhost:4566/_localstack/health | grep '"services":'; do
            sleep 10
          done

      - name: Deploy stacks to LocalStack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: bash ./lab_scripts/deploy.sh
