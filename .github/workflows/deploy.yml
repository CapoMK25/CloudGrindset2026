name: CD LocalStack Deployment

on:
  workflow_run:
    workflows: ["Checkov Security Scan"]
    types:
      - completed

concurrency:
  group: localstack-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout this repo into a subfolder named 'CloudGrindset2026'
      - name: Checkout IaC repository
        uses: actions/checkout@v4
        with:
          path: CloudGrindset2026

      # 2. Checkout the website repo into a sibling folder
      - name: Checkout Website repository
        uses: actions/checkout@v4
        with:
          repository: CapoMK25/regional-map-2024
          path: regional-map-2024

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd CloudGrindset2026
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install localstack-client pytest boto3

      - name: Deploying...
        run: echo "Security passed! Starting Localstack deployment."

      - name: Start LocalStack
        run: |
          docker run -d --name localstack_main \
            -p 4566:4566 -p 4510-4559:4510-4559 \
            localstack/localstack:latest

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack CloudFormation to be ready..."
          until curl -s http://localhost:4566/_localstack/health | grep -q '"cloudformation": "available"'; do
            sleep 5
          done

      - name: Deploy Infrastructure
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          ENDPOINT_URL: http://localhost:4566
        run: |
          cd CloudGrindset2026
          chmod +x ./lab_scripts/deploy_all.sh
          ./lab_scripts/deploy_all.sh

      - name: Verify Stacks
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url=http://localhost:4566 cloudformation list-stacks --stack-status-filter CREATE_COMPLETE

      - name: Run Integration Tests
        env:
          STACK_NAME: iam
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          cd CloudGrindset2026
          pytest tests/test_infra.py -v -s -ra