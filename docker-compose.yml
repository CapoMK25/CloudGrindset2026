version: '3.8'

services:
  localstack:
    container_name: localstack_main
    image: localstack/localstack:3.2.0 # Fixed version to prevent "latest" breaking changes
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  grafana:
    container_name: grafana_main
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - localstack

  app:
    container_name: cloudgrindset_app
    build: .
    env_file:
      - .env
    depends_on:
      localstack:
        condition: service_healthy 
    volumes:
      - .:/app
      - ../regional-map-2024:/regional-map-2024:ro