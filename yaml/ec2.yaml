Description: 'Tiered Security: ALB -> EC2 (CloudGrindset 2026)'
Parameters:
  InstanceType:
    Default: t3.nano
    Type: String
Resources:
  ALBSecurityGroup:
    Metadata:
      checkov:
        skip:
          - comment: ALB must be open on port 80 for public web traffic.
            id: CKV_AWS_260
    Properties:
      GroupDescription: Public internet access for the Load Balancer
      SecurityGroupIngress:
        - CidrIp: '0.0.0.0/0'
          Description: Allow HTTP from the Internet
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
      Tags:
        - Key: Name
          Value: ALB-SG
      VpcId: !ImportValue 'GrindsetVPC-ID'
    Type: AWS::EC2::SecurityGroup
  WebListener:
    Metadata:
      checkov:
        skip:
          - comment: Using HTTP for localstack/demo purposes without ACM cert.
            id: CKV_AWS_2
          - comment: TLS 1.2 not applicable for HTTP listener.
            id: CKV_AWS_103
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref 'WebTargetGroup'
          Type: forward
      LoadBalancerArn: !Ref 'WebLoadBalancer'
      Port: 80
      Protocol: HTTP
    Type: AWS::ElasticLoadBalancingV2::Listener
  WebLoadBalancer:
    Properties:
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !ImportValue 'Grindset-ALB-Log-Bucket'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Name: Grindset-Web-ALB
      Scheme: internet-facing
      SecurityGroups:
        - !Ref 'ALBSecurityGroup'
      Subnets: !Split
        - ','
        - !ImportValue 'GrindsetPublicSubnets-List'
      Tags:
        - Key: Name
          Value: Grindset-Web-ALB
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
  WebServerInstance:
    Properties:
      IamInstanceProfile: !ImportValue 'iam-stack-InstanceProfileName'
      ImageId: ami-fake-local
      InstanceType: !Ref 'InstanceType'
      SecurityGroupIds:
        - !Ref 'WebServerSG'
      SubnetId: !Select
        - 0
        - !Split
          - ','
          - !ImportValue 'GrindsetPublicSubnets-List'
      Tags:
        - Key: Name
          Value: Grindset-Web-Server
      UserData: !Base64 "#!/bin/bash\napt update\napt install -y nginx\n"
    Type: AWS::EC2::Instance
  WebServerSG:
    Properties:
      GroupDescription: Allow ONLY ALB access
      SecurityGroupIngress:
        - Description: Allow HTTP traffic from ALB SG only
          FromPort: 80
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref 'ALBSecurityGroup'
          ToPort: 80
      Tags:
        - Key: Name
          Value: Web-Server-SG
      VpcId: !ImportValue 'GrindsetVPC-ID'
    Type: AWS::EC2::SecurityGroup
  WebTargetGroup:
    Properties:
      Port: 80
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref 'WebServerInstance'
          Port: 80
      VpcId: !ImportValue 'GrindsetVPC-ID'
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

