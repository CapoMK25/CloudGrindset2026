Description: 'Tiered Security: ALB -> EC2 (CloudGrindset 2026)'
Parameters:
  InstanceType:
    Default: t3.nano
    Description: EC2 Instance Type
    Type: String
Resources:
  ALBLogBucket:
    Properties:
      BucketName: !Sub '${AWS::StackName}-alb-access-logs'
      LoggingConfiguration:
        DestinationBucketName: !Ref 'ALBLogBucket'
        LogFilePrefix: s3-access-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
    Type: AWS::S3::Bucket
  ALBSecurityGroup:
    Metadata:
      checkov:
        skip:
          - comment: ALB must be public to receive internet traffic
            id: CKV_AWS_260
    Properties:
      GroupDescription: Public internet access for the Load Balancer
      SecurityGroupIngress:
        - CidrIp: '0.0.0.0/0'
          Description: Allows public HTTP traffic to the load balancer
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
      Tags:
        - Key: Name
          Value: ALB-SG
      VpcId: !ImportValue 'GrindsetVPC-ID'
    Type: AWS::EC2::SecurityGroup
  ApplicationLoadBalancer:
    Properties:
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref 'ALBLogBucket'
      Name: Grindset-ALB
      Scheme: internet-facing
      SecurityGroups:
        - !Ref 'ALBSecurityGroup'
      Subnets: !Split
        - ','
        - !ImportValue 'GrindsetPublicSubnets-List'
      Tags:
        - Key: Name
          Value: Grindset-ALB
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
  WebListener:
    Properties:
      DefaultActions:
        - RedirectConfig:
            Port: '443'
            Protocol: HTTPS
            StatusCode: HTTP_301
          Type: redirect
      LoadBalancerArn: !Ref 'WebLoadBalancer'
      Port: 80
      Protocol: HTTP
    Type: AWS::ElasticLoadBalancingV2::Listener
  WebLoadBalancer:
    Properties:
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref 'ALBLogBucket'
      Name: Grindset-Web-ALB
      Scheme: internet-facing
      SecurityGroups:
        - !Ref 'ALBSecurityGroup'
      Subnets: !Split
        - ','
        - !ImportValue 'GrindsetPublicSubnets-List'
      Tags:
        - Key: Name
          Value: Grindset-Web-ALB
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
  WebServerInstance:
    Properties:
      IamInstanceProfile: !ImportValue 'iam-stack-InstanceProfileName'
      ImageId: ami-fake-local
      InstanceType: !Ref 'InstanceType'
      SecurityGroupIds:
        - !Ref 'WebServerSG'
      SubnetId: !ImportValue 'GrindsetPublicSubnets-List'
      Tags:
        - Key: Name
          Value: Grindset-Web-Server
      UserData: !Base64 "#!/bin/bash\napt update\napt install -y nginx\nsystemctl enable nginx\nsystemctl start nginx\n"
    Type: AWS::EC2::Instance
  WebServerSG:
    Properties:
      GroupDescription: Allow ONLY ALB and SSH access
      SecurityGroupIngress:
        - CidrIp: 1.2.3.4/32
          Description: SSH dummy access only
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
        - Description: Allow HTTP traffic from the ALB only
          FromPort: 80
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref 'ALBSecurityGroup'
          ToPort: 80
      Tags:
        - Key: Name
          Value: Web-Server-SG
      VpcId: !ImportValue 'GrindsetVPC-ID'
    Type: AWS::EC2::SecurityGroup
  WebTargetGroup:
    Properties:
      HealthCheckPath: /
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      Port: 80
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref 'WebServerInstance'
          Port: 80
      VpcId: !ImportValue 'GrindsetVPC-ID'
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

