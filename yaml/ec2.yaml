Description: EC2 Linux setup integrated with a Custom Networking Stack
Parameters:
  InstanceType:
    Default: t3.nano
    Description: EC2 Instance Type
    Type: String
Resources:
  WebServerInstance:
    Properties:
      ImageId: ami-fake-local
      InstanceType: !Ref 'InstanceType'
      SecurityGroupIds:
        - !Ref 'WebServerSG'
      SubnetId: !ImportValue 'GrindsetPublicSubnet-ID'
      UserData: !Base64 "#!/bin/bash\napt update\napt install -y nginx\nsystemctl enable nginx\nsystemctl start nginx\n"
    Type: AWS::EC2::Instance
  WebServerSG:
    Properties:
      GroupDescription: Allow HTTP and SSH access
      SecurityGroupIngress:
        - CidrIp: '0.0.0.0/0'
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
        - CidrIp: '0.0.0.0/0'
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
      VpcId: !ImportValue 'GrindsetVPC-ID'
    Type: AWS::EC2::SecurityGroup

