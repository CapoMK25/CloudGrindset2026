Description: LocalStack CloudWatch setup for an S3 website
Outputs:
  SharedKMSKeyArn:
    Description: KMS Key ARN for encryption
    Export:
      Name: !Sub '${AWS::StackName}-KMSKeyArn'
    Value: !GetAtt 'CloudWatchLogKey.Arn'
Resources:
  CloudWatchLogKey:
    Properties:
      Description: KMS Key for CloudWatch Log Group Encryption
      EnableKeyRotation: true
      Enabled: true
      PendingWindowInDays: 7
    Type: AWS::KMS::Key
  CloudWatchLogKeyAlias:
    Properties:
      AliasName: alias/cloudgrindset-logs
      TargetKeyId: !Ref 'CloudWatchLogKey'
    Type: AWS::KMS::Alias
  DemoLogGroup:
    Properties:
      KmsKeyId: !GetAtt 'CloudWatchLogKey.Arn'
      LogGroupName: cloudgrindset2026-logs
      RetentionInDays: 14
    Type: AWS::Logs::LogGroup
  DemoLogStream:
    Properties:
      LogGroupName: !Ref 'DemoLogGroup'
      LogStreamName: demo-stream
    Type: AWS::Logs::LogStream
  MonitoringDashboard:
    Properties:
      DashboardBody: >-
        {"widgets": [{"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {"metrics": [["AWS/S3", "4xxErrors", "BucketName", "regional-map-2024-website"]], "period": 300, "stat": "Sum",
        "region": "us-east-1", "title": "S3 Website 4xx Errors"}}]}
      DashboardName: CloudGrindset-S3-Health
    Type: AWS::CloudWatch::Dashboard
  S3WebsiteErrorAlarm:
    Properties:
      AlarmDescription: Alarm if S3 bucket returns too many 404s
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: BucketName
          Value: regional-map-2024-website
        - Name: FilterId
          Value: EntireBucket
      EvaluationPeriods: '1'
      MetricName: 4xxErrors
      Namespace: AWS/S3
      Period: '60'
      Statistic: Sum
      Threshold: '5'
    Type: AWS::CloudWatch::Alarm

